# Map layer with every recorded death (shown in squaremap's layer list)
layer-label: 历史死亡
# Map layer with only each player's most recent death
recent-layer-label: 最近死亡
# Hide both layers until a viewer turns one on
default-hidden: true
# Gravestone size on the map, in pixels
icon-size: 20
# How death times are shown in the tooltip (server timezone)
time-format: yyyy-MM-dd HH:mm
