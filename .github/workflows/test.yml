name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bcrypt (optional dependency for logging in)
        run: pip install bcrypt
      - name: Unit tests
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Byte-compile everything
        run: python -m compileall -q server tools

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in web/*.js; do node --check "$f"; done
